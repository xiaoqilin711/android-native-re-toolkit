[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "natool"
version = "0.1.0"
description = "Static-analysis helpers for obfuscated Android native libraries (OLLVM, string XOR, VM bytecode, crypto identification)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "natool contributors" }]
keywords = ["reverse-engineering", "android", "native", "arm64", "ollvm", "elf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = ["capstone>=4.0.2"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
natool = "natool.cli:main"

[tool.setuptools.packages.find]
include = ["natool*"]
